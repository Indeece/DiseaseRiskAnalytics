version: '3.8'

networks:
  risk-diseases:
    external: true

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: user_data
    environment:
      POSTGRES_DB: deseases
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - risk-diseases

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - risk-diseases

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - eureka-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deseases
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8090:8090"
    networks:
      - risk-diseases

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    depends_on:
      - auth-service
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "4000:4000"
    networks:
      - risk-diseases

  diabetes-api:
    build:
      context: ./diabetes-api
      dockerfile: Dockerfile
    depends_on:
      - auth-service
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8083:8083"
    networks:
      - risk-diseases

  heart-disease-api:
    build:
      context: ./heart-disease-api
      dockerfile: Dockerfile
    depends_on:
      - auth-service
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8084:8084"
    networks:
      - risk-diseases

  osteoporosis-api:
    build:
      context: ./osteoporosis-api
      dockerfile: Dockerfile
    depends_on:
      - auth-service
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8086:8086"
    networks:
      - risk-diseases
