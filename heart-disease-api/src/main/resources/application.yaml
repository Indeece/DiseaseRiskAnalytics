spring:
  application:
    name: heart-disease-api

server:
  port: 8084

model:
  url: http://localhost:80
  apikey:

feign:
  client:
    config:
      default:
        decode404: true
        encoder: org.springframework.cloud.openfeign.support.SpringEncoder
        defaultRequestHeaders:
          Content-Type: application/json
  jackson:
    encoder:
      mapper:
        serializationInclusion: ALWAYS

